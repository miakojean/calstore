version: '3.8'

services:

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "5432:5432"   # Accessible depuis ton poste (ex: DBeaver, pgAdmin)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./calstoreBackend
    # On écrase le CMD du Dockerfile : runserver en dev, pas Gunicorn
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./calstoreBackend:/app   # Hot-reload : les modifications sont prises en compte immédiatement
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy  # Attend que Postgres soit vraiment prêt

  frontend:
    build:
      context: ./calstore
      # Dockerfile dédié au dev : Node + Vite (pas de build Nginx)
      dockerfile: Dockerfile.dev
    volumes:
      - ./calstore:/app            # Hot-reload Vite
      - /app/node_modules          # Évite d'écraser node_modules du container
    ports:
      - "5173:5173"                # Port par défaut de Vite
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: