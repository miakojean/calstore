version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=votre_db
      - POSTGRES_USER=votre_user
      - POSTGRES_PASSWORD=votre_password

  backend:
    build: ./calstoreBackend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=votre_db
      - DB_USER=votre_user
      - DB_PASS=votre_password
      - DB_HOST=db
    depends_on:
      - db

  frontend:
    build: ./calstore
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: